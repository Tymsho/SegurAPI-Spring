# Test properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT configuration for tests
jwt.secret=${JWT_SECRET:SegurApiClaveSecretaDeDesarrolloConMasDe32BytesDeLongitud2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS configuration for tests
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Deshabilitar seeder en tests para acelerar y evitar efectos secundarios
app.seeder.enabled=false

# Mail configuration for tests (prevents NoSuchBeanDefinitionException)
spring.mail.host=localhost

# File uploads test config
file.upload-dir=uploads/
mp.access.token=TEST-TU-TOKEN-AQUI
