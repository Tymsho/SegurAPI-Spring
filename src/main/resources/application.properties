# Importar variables de entorno nativamente indicando que es formato properties
spring.config.import=optional:file:.env[.properties],optional:file:SegurAPI-Spring/.env[.properties]

# Puerto del servidor
server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seguros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate (Crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración del Servidor de Correo (SMTP de Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:TU_CORREO_AQUI}
spring.mail.password=${MAIL_PASSWORD:TU_CONTRASEÑA_AQUI}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de Archivos (Uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# Credenciales de MercadoPago (Token de Prueba)
mp.access.token=${MP_ACCESS_TOKEN:TEST-TU-TOKEN-AQUI}
