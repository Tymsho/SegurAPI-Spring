# Importar variables de entorno nativamente indicando que es formato properties
spring.config.import=optional:file:.env[.properties],optional:file:SegurAPI-Spring/.env[.properties]

# Puerto del servidor
server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seguros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JWT
jwt.secret=${JWT_SECRET:SegurApiClaveSecretaDeDesarrolloConMasDe32BytesDeLongitud2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuración de CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Configuración del Seeder de datos
app.seeder.enabled=${SEEDER_ENABLED:true}

# Configuración del Servidor de Correo (SMTP de Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:TU_CORREO_AQUI}
spring.mail.password=${MAIL_PASSWORD:TU_CONTRASEÑA_AQUI}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de Archivos (Uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# Credenciales de MercadoPago (Token de Prueba)
mp.access.token=${MP_ACCESS_TOKEN:TEST-TU-TOKEN-AQUI}

# Configuración de IA (Google Gemini Flash) para mapeo inteligente de carteras
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
